name: lumo_mobile_example
description: "A Material app that consumes Lumo UI Mobile's correctness layer. The mobile counterpart of apps/website: not a component showcase, a consumer — and the semantics grader's corpus."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # By PATH, not by tag. This app exists to fail when the library breaks, and a
  # pinned copy would keep passing while `packages/mobile` rotted beside it.
  lumo_ui_mobile:
    path: ../../packages/mobile

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/fonts/Inter-LICENSE.txt
    - assets/fonts/IRANSansX-LICENSE-NOTE.txt
  uses-material-design: true
  # Inter (OFL) and owner-licensed IRANSansX Pro; Unicode numerals.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
    - family: IRANSansX
      fonts:
        - asset: assets/fonts/IRANSansX-Thin.ttf
          weight: 100
        - asset: assets/fonts/IRANSansX-UltraLight.ttf
          weight: 200
        - asset: assets/fonts/IRANSansX-Light.ttf
          weight: 300
        - asset: assets/fonts/IRANSansX-Regular.ttf
          weight: 400
        - asset: assets/fonts/IRANSansX-Medium.ttf
          weight: 500
        - asset: assets/fonts/IRANSansX-DemiBold.ttf
          weight: 600
        - asset: assets/fonts/IRANSansX-Bold.ttf
          weight: 700
        - asset: assets/fonts/IRANSansX-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/IRANSansX-Black.ttf
          weight: 900
