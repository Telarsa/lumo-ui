# Supply chain. These live here, not in .npmrc: pnpm 11 does not read pnpm
# settings from .npmrc, so the same keys there are silently inert.
#
# Refuse any package published in the last 24 hours - the window in which most
# compromised releases are caught and unpublished. pnpm 11 applies a default
# cooldown even when this key is absent, and quietly writes a
# minimumReleaseAgeExclude entry to unblock the install rather than failing.
# Stating it explicitly is what makes the policy visible.
minimumReleaseAge: 1440

# Build scripts are denied by default in pnpm 11; a package must be named to run
# one. Nothing here needs to: sharp is a transitive Next dependency whose native
# binary only matters for image optimisation, and this site sets
# `images.unoptimized` because it is a static export. An empty list is a stated
# policy - "we run no install-time native builds" - rather than an oversight.
allowBuilds:
  # Denied explicitly, not merely unapproved. sharp is a transitive Next
  # dependency whose native binary only matters for image optimisation, and this
  # site is a static export with `images.unoptimized`. Stating it is the policy:
  # Lumo runs no install-time native builds.
  sharp: false

packages:
  - 'packages/*'
  - 'apps/*'

# Every version Lumo depends on is named once, here.
#
# EXACT pins, not ranges, for everything that can change rendered output or an
# accessible name. The reason is the churn model: an upstream change should
# arrive as a deliberate, reviewed bump that turns the gates red once - never as
# a silent resolution difference between a laptop and CI. A caret would let the
# accessibility-tree snapshots drift without a commit to blame.
#
# Ranges are used only for build tooling whose output the gates already check.
catalog:
  # --- behaviour layer (see DECISIONS.md §0) --------------------------------
  # TEST-ONLY since the type-only imports went. No shipped component imports
  # this package at runtime OR in a type position any more, so it is a
  # devDependency of `packages/ui` and appears in NO registry item — a consumer
  # copying a component never installs it. What still needs it are the six
  # POISON TWINS (`dates.test.tsx`, `controls.test.tsx`, `provider.test.tsx`,
  # `hydrated.test.tsx`, `collections-no-primitive.test.tsx`,
  # `scroll-area.test.tsx`), which render real React Aria to pin the defects the
  # migration was for. Deleting the pin would delete the evidence.
  #
  # Still pinned exactly, for the original reason: RAC minors have changed
  # default accessible names before, and a poison fixture that silently changes
  # what it pins is worse than no fixture.
  react-aria-components: 1.20.0
  # Must stay on the version RAC itself resolves, or `Calendar` types come from
  # two copies of the package and will not assign.
  '@internationalized/date': 3.12.3
  # EXPERIMENT ONLY (branch experiment/base-ui). NOTE the package RENAME:
  # `@base-ui-components/react` is dead at 1.0.0-rc.0 and must not be measured.
  # 1.7.0 published 2026-08-04, six days before adoption — clears the cooldown.
  #
  # THE PIN IS LOAD-BEARING HERE IN A WAY IT IS NOT FOR THE OTHERS. Every fix in
  # `packages/base-ui-ssr` compensates for an implementation choice — an
  # accessible name published from a layout effect, an English literal at a known
  # file and line — and not for a documented seam. A patch release may retire a
  # workaround or silently defeat it, in both cases with no type error. So this
  # version is the one that package declares in its peer range and its README's
  # "verified against" line, and moving it is a deliberate bump that re-runs
  # `gate:html` and `packages/base-ui-ssr`'s own suite, never a resolution
  # difference between two machines.
  '@base-ui/react': 1.7.0

  # NOT IN THIS CATALOG, deliberately: `@lumo-ui/base-ui-ssr`. The catalog names
  # versions of packages Lumo does not control. A workspace package enters
  # through `workspace:*`, the same route `@lumo-ui/core` takes; if the SSR layer
  # is ever published and consumed from the registry rather than the workspace,
  # its version belongs here and not before.

  # --- runtime ---------------------------------------------------------------
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4

  # --- class composition -----------------------------------------------------
  # tailwind-merge is pinned exactly: it encodes Tailwind's own conflict groups,
  # so a minor that mis-merges `ms-2 ms-4` silently produces wrong spacing in RTL.
  # packages/core/src/cn.test.ts asserts that exact case.
  clsx: 2.1.1
  tailwind-merge: 3.6.0
  class-variance-authority: 0.7.1

  # --- styling ---------------------------------------------------------------
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  tw-animate-css: 1.4.0

  # --- icons -----------------------------------------------------------------
  # 1.31.0 published 2026-08-09 and was correctly refused by minimumReleaseAge.
  # Pinned one behind rather than adding an exclude: the cooldown is the policy,
  # and bypassing it for convenience is how the policy stops meaning anything.
  lucide-react: 1.30.0

  # --- charts ----------------------------------------------------------------
  # recharts 3.8.0 WAS HERE and is gone as of 11 Aug 2026. It was the one
  # dependency Lumo took for rendered geometry rather than behaviour, pinned to
  # the version shadcn's `chart` item declares. `@tanstack/charts` replaced it
  # in `chart.tsx` on the measured axis below, and the pin was left behind for
  # exactly one commit: no file in the tree imported it, while two package.json
  # manifests and the registry's EXTERNAL set still told consumers to install
  # it. A dependency nothing imports is not free — it is a version this project
  # is on the hook for, an entry in every consumer's lockfile, and a line in the
  # `chart` registry item's install command that installs a renderer the file
  # no longer uses. Deleted rather than kept "in case".
  #
  # THE RENDERER, since 11 Aug 2026. `@tanstack/charts` replaces recharts in
  # `chart.tsx` on one measured axis: recharts serves 127 bytes and NO `<svg>`,
  # TanStack serves 4,717 with a real `<svg>` and Persian ticks, so `lumo-gate`
  # — which grades the SERVED HTML — stops being structurally blind to the most
  # number-dense component in the library (experiments/measurements/
  # tanstack-charts.json).
  #
  # 0.9.0 AND NOT 0.11.0, and that is the cooldown working rather than a
  # preference. Checked at 2026-08-11T07:38Z: 0.11.0 published 06:17 earlier,
  # 0.10.0 07:18 earlier — both inside `minimumReleaseAge: 1440`. 0.9.0
  # published 2026-08-09T23:13Z, 32 hours old, clears it. Pinned one — two —
  # releases behind rather than adding an exclude, per CONTRIBUTING.md.
  #
  # THE PIN IS LOAD-BEARING AND THE MAINTENANCE COST IS REAL. The upstream repo
  # is 13 days old, has shipped 19 releases, self-describes its API as
  # "pre-alpha", and has already REPLACED the axis configuration surface once
  # (0.3.0) — the one surface Lumo's RTL work sits on. Budget a wrapper REWRITE,
  # not a re-pin, on roughly every minor until 1.0. The React adapter is the
  # `./react` subpath of this one package; `@tanstack/react-charts` is the dead
  # pre-0.9.0 name and must not be added.
  '@tanstack/charts': 0.9.0

  # --- the calendar GRID (not the calendar SYSTEM) ---------------------------
  # Adopted 11 Aug 2026 for the date family, and the split is the whole point:
  # this supplies the month grid, its roving tab stop, its labels and its
  # keyboard model; `@internationalized/date` supplies WHICH CALENDAR those days
  # belong to. Lumo binds the two with `calendar-datelib.ts`.
  #
  # 10.0.1 AND NOT 9.14.0, which is the version that ships
  # `react-day-picker/persian`. That entry point is genuinely excellent —
  # measured on a server render, it produced «۱ مرداد ۱۴۰۳», 57 Persian digits,
  # zero Latin, and ZERO lumo-gate violations with no configuration at all — and
  # it is still the wrong choice here, because it is PERSIAN-ONLY. Its calendars
  # are separate entry points bound to separate forked date libraries
  # (`/persian` -> date-fns-jalali, `/hijri` -> a hijri converter), so a second
  # locale is a second component and a second dependency. Lumo serves fa-IR,
  # en-US and grades ar-SA; a design where adding a locale means adding a
  # package is the opposite of this library's reason to exist.
  #
  # v10 dropped those entry points AND their date libraries — its `locale/fa-IR`
  # is date-fns's Persian locale over a GREGORIAN grid, which renders
  # «۲۲ ژوئیه ۲۰۲۴» and is exactly the defect `native-calendar` was written to
  # catch. What v10 KEPT is the seam: `dateLib` overrides and the `formatters`
  # prop group. So v10 is not a regression for us, it is an invitation — bring
  # your own calendar — and `@internationalized/date` brings thirteen of them
  # behind one runtime `createCalendar(id)`.
  #
  # Exact pin for the usual reason, plus one specific to this package: the
  # `DateLib` surface IS our integration contract, and a minor that renames a
  # member silently drops an override back to Gregorian. `native-calendar` is
  # the backstop that turns that into a red build rather than a wrong year.
  # 10.0.1 published 2026-05-15, three months old — well clear of the cooldown.
  react-day-picker: 10.0.1
  # Build-time only: server components highlight during the static export, so
  # none of this reaches a client bundle. 4.4.3 was six hours old at adoption —
  # inside the 24h cooldown — so this pins one release behind, per the rule.
  shiki: 4.4.2

  # --- headless STATE, with no markup and no ARIA -----------------------------
  # None of these are accessibility dependencies, and that is the whole reason
  # they are acceptable beside Base UI. Base UI has no table, no virtualiser and
  # no form state; TanStack supplies the arithmetic (sort/filter/paginate/select
  # state; item offsets and a window; field values, validity and submission) and
  # emits no DOM, no role, no aria-* and no focus management. Lumo keeps
  # role=grid, aria-sort, aria-rowcount, aria-setsize, the roving tab stop, the
  # RTL arrow mapping and the error/description associations — one accessibility
  # dependency, not two. If a future TanStack minor starts returning props with
  # `role` or `aria-*` in them, that is the signal to stop spreading its output,
  # not to adopt it.
  #
  # Exact pins for the usual reason: all three compute geometry, ordering or
  # validity that the committed tests read back out.
  '@tanstack/react-table': 9.1.2
  #
  # `@tanstack/react-virtual` 3.14.9 WAS HERE and is gone as of 11 Aug 2026 —
  # the one TanStack package replaced rather than kept, because it was the only
  # one with defects measured against THIS library rather than in general:
  # measurements cached by index so they stay behind when a list reorders, a
  # `getScrollElement` getter that re-subscribes the scroll listener on every
  # render, and an `isRtl` option defaulting to `false` that silently windows
  # the wrong end of a horizontal Persian list. All three are closed by DELETING
  # the option rather than setting it, in `packages/ui/src/virtualizer.ts`.
  #
  # The others stay, and the test that separates them is the same one: owning it
  # must fix a defect, not merely remove a name from a manifest. Table and Form
  # emit no DOM, no ARIA and no English, and neither had a defect for us.
  # THE FORM STATE LAYER, since 11 Aug 2026. Adopted for one reason that is
  # Lumo's rather than general, and it is the exact inverse of React Aria's:
  #
  #   React Aria ships 34 locale bundles of announced strings and `fa` is not
  #   among them, so every leak had to be measured and closed (see
  #   `packages/core/src/strings.ts`). TanStack Form ships NO announced strings
  #   AT ALL. Verified against the published 1.33.4 tarballs, runtime `.js`
  #   only: zero `aria-*`, zero `role`, zero host element names — every `jsx()`
  #   call in the React adapter renders a Fragment, a Context.Provider or one of
  #   the library's own components, so `<form.Field>` contributes ZERO BYTES to
  #   the served HTML. The only English in the runtime is developer assertions
  #   ("field component names must be unique", "Path must be a string.") which
  #   reach a console and never a page.
  #
  #   Nothing to translate is a stronger property than translatable, because
  #   there is no version bump that can add a string behind our back to a
  #   surface that renders no text.
  #
  # SSR: field state is read from the store DURING RENDER; the layout effects
  # (`useIsomorphicLayoutEffect`, which is `useEffect` on the server and so a
  # no-op) only mount and update. So default values are in the first byte and
  # this is NOT another instance of the Base UI layout-effect defect. The form
  # id comes from React's own `useId`. Both verified by reading dist, and both
  # pinned by `form-state.test.tsx`.
  #
  # TRANSITIVE COST, CHECKED: `@tanstack/form-core` imports
  # `@tanstack/devtools-event-client` unconditionally and constructs a client at
  # module scope with `reconnectEveryMs: 1000`. That reads alarming and is not —
  # the package's root export is
  # `process.env.NODE_ENV !== "development" ? EventClientNoOp : EventClient`, so
  # a production build folds it to a no-op class and tree-shakes the real client
  # (with its `setInterval` and its `window.addEventListener`) away. Recorded
  # because the next person to read that import will have the same reaction.
  #
  # 1.33.4 published 2026-08-08T22:31Z, 58 hours old at adoption — clears
  # `minimumReleaseAge: 1440`. A 2.0.0-alpha.0 exists on the `alpha` tag and is
  # not a candidate.
  '@tanstack/react-form': 1.33.4

  # --- carousel --------------------------------------------------------------
  # 9.0.0-rc02 is a prerelease; 8.6.0 is the newest stable. Exact, because embla
  # computes the scroll geometry Lumo then has to mirror under `direction: rtl`,
  # and `carousel.test.tsx` pins the `direction` option it reads.
  embla-carousel-react: 8.6.0

  # --- framework -------------------------------------------------------------
  next: 16.0.4
  '@fontsource-variable/vazirmatn': 5.3.0

  # --- the gate --------------------------------------------------------------
  # No browser in CI. linkedom parses the built HTML; dom-accessibility-api
  # computes accessible names over it.
  linkedom: 0.18.13
  dom-accessibility-api: 0.7.1

  # Must track .nvmrc (24), NOT npm latest. Types ahead of the runtime describe
  # APIs that do not exist at run time, and tsc will happily accept them.
  '@types/node': 24.13.3

  # --- test / types ----------------------------------------------------------
  # TypeScript is pinned exactly and must NOT be auto-bumped to 7.x: no released
  # typescript-eslint accepts it yet.
  typescript: 6.0.3
  vitest: ^4.1.10
  jsdom: ^30.0.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.3
  '@vitejs/plugin-react': ^6.0.5

  # --- lint ------------------------------------------------------------------
  eslint: ^9.40.0
  typescript-eslint: ^9.0.0
  stylelint: ^17.14.1

  # --- distribution ----------------------------------------------------------
  # The CLI that builds the registry and applies the RTL transform. Pinned so
  # `shadcn migrate rtl` cannot change its rewrite table under us between runs.
  shadcn: 4.16.2

