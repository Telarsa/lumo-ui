<!doctype html>
<html lang="fa-IR" dir="rtl">
  <body>
    <h1>مرداد ۱۴۰۵</h1>
    <table><tr><td>12</td><td>13</td><td>14</td></tr></table>
    <!-- POISON: the digits a reader sees in an INPUT's served value (a NumberField
         formatting in the runtime locale served exactly this under fa-IR). -->
    <input aria-label="مبلغ" value="1,234" />
    <!-- POISON: a Latin digit in an announced string on a plain element. The rule
         always graded aria-label, but this fixture only covered the input-value
         shape — co-shaped with the implementation — until a live product page
         (an insurance quote wizard) shipped exactly this and the gap in
         the FIXTURE went unnoticed while a streaming bug hid the finding (§50.5). -->
    <div aria-label="مرحله 1 از ۳"><span></span><span></span></div>
    <!-- NOT violations: Latin-by-nature inputs, and a declared island. -->
    <input type="tel" aria-label="تلفن" value="+98 912" />
    <input aria-label="کد سفارش" data-lumo-latn value="AC-4825" />
  </body>
</html>
