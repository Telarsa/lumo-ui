<!doctype html>
<html lang="fa-IR" dir="rtl">
  <body>
    <!-- A name that resolves to nothing. -->
    <input aria-labelledby="does-not-exist" />

    <!--
      A validation error that is DRAWN and announced by nobody. Visually this is
      a correct, complete, invalid field; the only thing wrong with it is the
      one thing a screen reader depends on. `form-state.tsx` routes every
      validation message through this attribute, so grading it is what makes
      that route trustworthy.
    -->
    <label id="email-label">ایمیل</label>
    <input aria-labelledby="email-label" aria-describedby="email-error" aria-invalid="true" />
    <p>نشانی ایمیل معتبر نیست</p>

    <!-- The attribute whose only job is to carry an error, carrying nothing. -->
    <input aria-labelledby="email-label" aria-errormessage="gone" />
  </body>
</html>
