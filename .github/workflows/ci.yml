# This repository's own pipeline. It is deliberately self-contained.
#
# An earlier version called a shared reusable workflow from telarsa-handbook.
# That coupled twelve repositories to one file in a thirteenth: it had to exist
# on the referenced branch, and the handbook had to grant sibling repositories
# access to its workflows. Both are invisible from here, and when either was
# wrong every repository failed at once, before a single job started.
#
# The canonical copy of this file lives in telarsa-handbook under
# ci/node-ci.template.yml. Copy it; do not reference it.
name: CI

# No paths-ignore. It used to skip '**/*.md', which exempted exactly the
# change class that kept shipping stale claims: documentation counts that no
# gate ever re-derived. A doc-only push costs one 20-minute runner; a wrong
# public number costs trust.
#
# 'experiment/**' is included because the Base UI migration lived on
# experiment/base-ui for weeks with zero CI — every gate in this file was
# advisory there. Long-lived branches get graded, not just protected ones.
on:
  push:
    branches: [main, develop, 'experiment/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      # node-version-file reads .nvmrc, so CI and developers share one runtime
      # and there is no second place to update.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile also re-runs the supply-chain check: pnpm verifies
      # every lockfile entry against minimumReleaseAge, so a lockfile produced
      # by bypassing the cooldown locally fails here rather than shipping.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Runtime truth, checked on the RUNNER rather than on a laptop.
      #
      # If the runner's Node ships small-ICU, `Intl` has no Persian calendar and
      # no arabext numbering system - and every Jalali claim Lumo makes is a lie
      # that no unit test would catch, because the unit tests run here too.
      # This runs FIRST: everything downstream is meaningless if it fails.
      - name: Intl / ICU capability
        run: |
          node --input-type=module -e '
            const fail = (m) => { console.error("  FAIL " + m); process.exitCode = 1 };
            const cal = new Intl.DateTimeFormat("fa-IR").resolvedOptions().calendar;
            const num = new Intl.DateTimeFormat("fa-IR").resolvedOptions().numberingSystem;
            const money = new Intl.NumberFormat("fa-IR").format(1234.5);
            console.log(`  node       ${process.version}`);
            console.log(`  calendar   ${cal}`);
            console.log(`  numbering  ${num}`);
            console.log(`  1234.5     ${money}`);
            if (cal !== "persian") fail(`fa-IR calendar is "${cal}", expected "persian" - small-ICU build?`);
            if (num !== "arabext") fail(`fa-IR numberingSystem is "${num}", expected "arabext"`);
            if (!/[۰-۹]/.test(money)) fail("fa-IR NumberFormat produced no Persian digits");
            if (!money.includes("٫")) fail("fa-IR decimal separator is not U+066B");
          '

      # Rule 0. Fires in the editor too, but this is the enforcement point.
      - name: Types
        run: pnpm run gate:types

      # A prop that is typed, accepted and never delivered. It renders nothing,
      # throws nothing and type-checks, so it is invisible to every step below
      # this one — the tests it breaks are tests nobody wrote. Runs straight
      # after Types because a file that does not compile has a better error
      # waiting for it, and before Tests because an inert prop makes tests PASS.
      - name: Inert props
        run: pnpm run gate:props

      # The RTL contract's mechanical half, and the only step that can see a
      # conditional hook. Sits beside Inert props because both grade SOURCE, and
      # BEFORE Tests for the reason that makes this class of defect expensive: a
      # physical utility does not make a test fail, it makes tests PASS while the
      # Persian page mirrors wrong. Wired in on 12 Aug 2026; before that the
      # policy existed and nothing executed it.
      - name: Lint
        run: pnpm run gate:lint

      # The mechanical form of the styling decision. Without it, "we use
      # Tailwind" is a comment.
      - name: No CSS Modules
        run: pnpm run gate:no-css-modules

      # Unit + self-test tiers. The gate's own poison fixtures live here: a rule
      # that stops detecting turns this red.
      - name: Tests
        run: pnpm run gate:test

      # The registry must be derivable and non-empty. A drifted manifest ships a
      # component nobody can install.
      - name: Registry
        run: |
          node scripts/build-registry.mjs
          git diff --exit-code registry.json

      # The prop reference is generated from the checker. Keeping this separate
      # from Registry makes a stale API artifact name itself in CI.
      - name: API reference
        run: pnpm run gate:api

      # Two minutes standing between us and publishing a registry nobody has
      # ever installed from. Copies every item into a bare project and compiles
      # it, so a dependency missing from a registry entry fails here rather than
      # in a consumer's repository.
      - name: Consumer smoke test
        run: pnpm run gate:smoke

      # The real one: build the site and grade the bytes it serves. Everything
      # above this line is a proxy; this is the artifact a user receives.
      - name: Build and gate
        run: pnpm run gate:html

      # Keeps the built site available for inspection when the gate fails, which
      # is exactly when you want to look at the HTML.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: site-output
          path: apps/website/out
          retention-days: 3

  # Kept separate from verify because it intentionally launches one related
  # Vitest process per registry component. This is a mutation floor, not a
  # replacement for the behavioral suite: most modules exercise rendered class
  # assignment, while high-risk modules use component-specific behavior probes.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Component mutation floor
        run: pnpm run mutation:components
