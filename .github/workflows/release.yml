# The entire release pipeline for lumo-ui.com. The build, the OCI labels, the
# digest and the deploy pull request all live in the shared workflow, so every
# Telarsa repository deploys the same way by construction.
#
# Trigger: a tag `v<major>.<minor>.<patch>` — the SAME tag consumers install
# from (`github:Telarsa/lumo-ui#vX.Y.Z`). One tag therefore does two things now:
# it publishes the library, as it always did, and it ships the website that
# documents it. That is deliberate — the docs a reader gets should be the docs
# for the version they can install — and it is the reason a tag is still
# something to ask the owner about (AGENTS.md, "Ask before").
#
# The image lands at ghcr.io/telarsa/lumo-ui-site and its digest is pinned in
# Telarsa/infrastructure by the pull request this opens; that repository already
# carries the stack (stacks/lumo-ui) and the vhost (platform/caddy/sites/
# lumo-ui-prod.caddy) waiting for it. INFRA_PR_TOKEN is an organisation secret;
# without it the image is still pushed and the deploy PR is skipped.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One release at a time per tag, and never cancelled: a half-pushed image is
# worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    strategy:
      # One entry per deployable. This repository has one: the website. The
      # Dockerfile is not at the root because the build context is — the site
      # depends on the package beside it.
      matrix:
        app: [site]
      fail-fast: false
    uses: Telarsa/infrastructure/.github/workflows/release-image.yml@main
    with:
      app: ${{ matrix.app }}
      dockerfile: apps/website/Dockerfile
      deploy_env: prod
    secrets:
      INFRA_PR_TOKEN: ${{ secrets.INFRA_PR_TOKEN }}
